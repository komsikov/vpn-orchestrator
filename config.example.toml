# Пример конфигурации vpn-orchestrator
# Шаблон: скопируйте его и замените интерфейсы, пути и upstream на свои.
# Не запускайте файл без настройки серверного интерфейса и включённых upstream.

[server]
# Серверный VPN-интерфейс (принимает клиентов)
interface = "wg0"
# type = "wireguard"          # wireguard (по умолчанию) или amneziawg
subnet = "10.42.42.0/24"
listen_port = 51820
# Если серверный интерфейс уже поднят внешним инструментом (wg-easy, wg-quick и т.д.) —
# удалите config_path или запускайте с --skip-server.
# Оркестратор только проверит что интерфейс жив и будет мониторить пиров.
# config_path = "/etc/wireguard/wg0.conf"

# === Upstream VPN — список в порядке приоритета ===
# Первый здоровый upstream становится активным.
# При недоступности активного — failover на следующий.
# Если недоступны все — прямой выход через default route из main, затем возврат на VPN.
# enabled = false — не запускается, не проверяется, не попадает в метрики.
# Изменение конфига применяется после перезапуска сервиса.

# Primary: WireGuard
# [[upstream]]
# name = "primary-wg"
# type = "wireguard"
# interface = "wg1"
# config_path = "/etc/wireguard/wg1.conf"
# enabled = true
# health_check_interval = 10       # секунды между проверками
# health_check_target = "8.8.8.8"  # IP для ping через интерфейс
# health_check_timeout = 3         # таймаут ping (секунды)
# failover_threshold = 3           # неудач подряд до переключения

# Пример AmneziaWG: замените name и config_path на свои.
[[upstream]]
name = "primary-awg"
type = "amneziawg"
interface = "awg0"
config_path = "/etc/amnezia/awg0.conf"
enabled = true
health_check_interval = 10
health_check_target = "1.1.1.1"
health_check_timeout = 3
failover_threshold = 3

[[upstream]]
name = "backup-awg"
type = "amneziawg"
interface = "awg1"
config_path = "/etc/amnezia/awg1.conf"
health_check_interval = 10
health_check_target = "1.1.1.1"
health_check_timeout = 3
failover_threshold = 3

# Backup 2: Xray / 3x-ui (TUN-режим)
# [[upstream]]
# name = "backup-3xui"
# type = "xray"
# interface = "tun0"
# config_path = "/etc/xray/config.json"
# health_check_interval = 15
# health_check_target = "1.1.1.1"
# health_check_timeout = 5
# failover_threshold = 3

[routing]
enable_ip_forward = true
route_table = 100
# Таблицы 100–102 зарезервированы для клиентов и проб двух включённых upstream.
# Дополнительные маршруты внутри клиентской таблицы (источники: server.subnet)
extra_prefixes = []

[nat]
masquerade = true
use_nftables = true

# === Замер скорости upstream-ов ===
# Периодически загружает тестовый файл через каждый upstream-интерфейс
# и логирует скорость. При min_mbps > 0 — переключается на более быстрый,
# если активный upstream ниже порога. Защита от частых переключений задаётся
# полями monitoring.selector (hold/cooldown/advantage/consecutive_wins),
# даже когда selector.enabled = false. Замер — одно соединение до URL, не Speedtest Multi.

[speed_test]
# По умолчанию выключен: каждая проба скачивает файл через каждый upstream.
enabled = false
url = "https://speed.cloudflare.com/__down?bytes=10000000"  # 10 MB
interval = 300          # секунды между замерами
timeout = 30            # таймаут загрузки (секунды)
min_mbps = 0.0          # порог переключения (0 = только логирование)

# === Логирование ===
# По умолчанию логи идут в stdout.
# Укажите file, чтобы писать в файл вместо stdout.
# level: trace / debug / info / warn / error (по умолчанию info).
# max_size_mb: ротация при превышении размера (0 = без лимита).
# keep_mb: сколько МБ оставить при ротации (последние записи).
# Можно отключить полностью: enabled = false или флаг --quiet.

[logging]
enabled = true
file = "/var/log/vpn-orchestrator.log"
level = "info"
max_size_mb = 10            # ротация при превышении (0 = без лимита)
keep_mb = 1                 # сколько МБ оставить при ротации

# === Расширенный мониторинг (полный пример и scoring-поля — в README) ===
[monitoring]
enabled = false
health_targets = ["1.1.1.1", "8.8.8.8"]
health_interval = 15
health_timeout = 2
health_probe_count = 5
https_enabled = true
# Проверка доступности нужных сервисов через каждый upstream.
# Все URL имеют одинаковый вес в HTTPS-score.
https_targets = [
  "https://www.youtube.com/generate_204",
  "https://chatgpt.com/",
  "https://www.instagram.com/",
  "https://web.telegram.org/",
  "https://1.1.1.1"
]
https_interval = 60
https_timeout = 10
ewma_alpha = 0.2
history_size = 1000
quality_enabled = false
quality_url = "https://speed.cloudflare.com/__down?bytes=5000000"
quality_interval = 300
quality_timeout = 30
prometheus_enabled = false
prometheus_port = 9099

[monitoring.selector]
enabled = false
minimum_advantage = 0.10
consecutive_wins = 3
minimum_hold_secs = 180
cooldown_secs = 300

[monitoring.scoring]
availability_weight = 0.35
latency_weight = 0.25
loss_weight = 0.15
jitter_weight = 0.15
http_weight = 0.10
latency_max_ms = 500.0
jitter_max_ms = 20.0
healthy_threshold = 75.0
degraded_threshold = 40.0
fast_weight = 0.90
historical_weight = 0.10
